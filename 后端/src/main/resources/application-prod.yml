server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: elderly-care
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/elderly_care?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:elderly_admin}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat

qweather:
  api-key: ${QWEATHER_API_KEY:}
  base-url: https://nu3qqrcgdj.re.qweatherapi.com/v7

jwt:
  secret: ${JWT_SECRET:elderly-care-jwt-secret-key-2024-production-secure-random-string-for-smart-elderly-platform}
  expiration: 604800000

wechat:
  pay:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-key: ${WECHAT_API_KEY:}
    notify-url: https://liyirou.top/api/pay/notify

app:
  cors:
    allowed-origins: https://liyirou.top,https://www.liyirou.top

file:
  upload-path: /opt/elderly/upload/

logging:
  level:
    com.elderly: warn
    org.springframework: warn
    org.mybatis: warn
    org.apache.ibatis: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /opt/elderly/logs/app.log
    max-size: 10MB
    max-history: 30
