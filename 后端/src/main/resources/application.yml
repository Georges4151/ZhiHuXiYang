server:
  port: 8080

spring:
  application:
    name: elderly-care
  profiles:
    # 本地真实密钥放在 application-local.yml（已在 .gitignore 中忽略）
    active: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/elderly_care?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:your-db-password}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

deepseek:
  api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat

qweather:
  api-key: ${QWEATHER_API_KEY:your-qweather-api-key}
  base-url: https://nu3qqrcgdj.re.qweatherapi.com/v7

jwt:
  secret: ${JWT_SECRET:elderly-care-jwt-secret-key-2024}
  expiration: 604800000

# 微信支付配置
wechat:
  pay:
    app-id: wx8888888888888888  # 小程序appid
    mch-id: 1234567890          # 商户号
    api-key: your-api-key-here  # API密钥
    notify-url: http://localhost:8080/api/pay/notify  # 支付回调地址
    
file:
  upload-path: d:/养老/upload/

logging:
  level:
    com.elderly: debug
    org.springframework.web: info
